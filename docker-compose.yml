version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: edda-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: edda_db
      MYSQL_USER: edda_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - edda_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis is OPTIONAL: The application starts and runs normally without Redis.
  redis:
    image: redis:7-alpine
    container_name: edda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - edda_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edda_mysql_data:
    driver: local
  edda_redis_data:
    driver: local
