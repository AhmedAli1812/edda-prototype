s="btn btn-danger btn-sm">إيقاف مؤقت</button><button class="btn btn-soft btn-sm">مراجعة</button></div></div></section></div>`)}

function adminFinance(){return wrap(`${topbar('المالية والتسويات',false)}<div class="content"><div class="wallet-hero section"><small>إيراد المنصة هذا الشهر</small><h2>186,400 ج.م</h2><div class="tiny" style="color:#bdd0dd">عمولات خدمات + عمولات متجر + رسوم حماية</div></div><div class="stats section"><div class="stat"><b>1.24M</b><span>GMV</span></div><div class="stat"><b>14.9%</b><span>Take Rate</span></div><div class="stat"><b>32K</b><span>معلق</span></div></div><div class="section-head"><div><h3>حسابات التسوية</h3><p>مطابقة عمليات بوابة الدفع</p></div></div><div class="table">${[['الفنيون','420,500 ج.م','غدًا'],['المتاجر','178,300 ج.م','الأحد'],['مبالغ معلقة','32,140 ج.م','نزاعات']].map((x,i)=>`<div class="table-row"><div><b>${x[0]}</b><div class="tiny muted">${i===0?'143 فني':i===1?'22 متجر':'4 حالات'}</div></div><span>${x[1]}</span><span class="status ${i===2?'red':'green'}">${x[2]}</span></div>`).join('')}</div><div class="note" style="margin-top:12px">التطبيق لا يحتفظ بأموال العملاء بنفسه؛ التكامل الإنتاجي يجب أن يتم مع بوابة دفع ومزوّد تسويات متوافق مع القواعد المحلية.</div></div>`)}
function adminPartners(){return wrap(`${topbar('الشركاء والاعتمادات',false)}<div class="content"><div class="stats section"><div class="stat"><b>642</b><span>فني</span></div><div class="stat"><b>22</b><span>متجر</span></div><div class="stat"><b class="negative">9</b><span>تنتظر مراجعة</span></div></div><div class="section-head"><h3>طلبات انضمام</h3></div>${[['الفني محمد عادل','هوية + فيش + شهادة خبرة','فني'],['النور للأدوات','سجل تجاري + بطاقة ضريبية','متجر'],['الفني سامح حسن','هوية + إثبات عنوان','فني']].map(x=>`<div class="card transaction"><span class="iconbox">${icon(x[2]==='فني'?'wrench':'store')}</span><div><h4>${x[0]}</h4><p>${x[1]}</p></div><button class="btn btn-dark btn-sm">مراجعة</button></div>`).join('')}</div>`)}
function profile(role){let names={technician:['أحمد سالم','فني كهرباء موثّق'],merchant:['بيت الكهرباء','محل شريك موثّق']};let n=names[role]||['محمد أدهم','عميل عِدّة'];return wrap(`${topbar('الحساب',false)}<div class="content" style="text-align:center;padding-top:28px"><div class="avatar" style="width:76px;height:76px;border-radius:24px;margin:0 auto 9px;font-size:22px">${n[0][0]}</div><h3 style="font-size:16px;margin:0">${n[0]}</h3><p class="small muted">${n[1]}</p><div class="choice-list" style="text-align:right;margin-top:20px"><button class="choice"><span class="iconbox">${icon('user')}</span><span><strong>البيانات والتحقق</strong><p>الهوية والمستندات والحساب البنكي</p></span></button><button class="choice"><span class="iconbox">${icon('shield')}</span><span><strong>السياسات والضمان</strong><p>قواعد المنصة والدفع والنزاعات</p></span></button><button class="choice" data-action="logout"><span class="iconbox">${icon('back')}</span><span><strong>تسجيل الخروج</strong></span></button></div></div>`)}
function sheet(){if(state.sheet==='bid')return `<div class="sheet-back" data-action="close-sheet"><div class="sheet" onclick="event.stopPropagation()"><h3>تقديم عرض محمي</h3><p>السعر الأساسي يجب أن يشمل المعاينة. أي تغيير لاحق يتم بموافقة العميل.</p><div class="field"><label>السعر المقترح</label><div class="input">${icon('money','sm')}<input value="340 ج.م"></div></div><div class="field"><label>موعد الوصول</label><div class="input">${icon('clock','sm')}<input value="خلال 45 دقيقة"></div></div><div class="field"><label>الضمان</label><div class="input">${icon('shield','sm')}<input value="30 يوم على التنفيذ"></div></div><button class="btn btn-primary" data-action="submit-bid">إرسال العرض</button></div></div>`;if(state.sheet==='tech-change')return `<div class="sheet-back" data-action="close-sheet"><div class="sheet" onclick="event.stopPropagation()"><h3>إضافة عمل أو قطعة</h3><p>لن تبدأ العمل الإضافي قبل دفع العميل داخل التطبيق.</p><div class="field"><label>نوع الإضافة</label><div class="input"><select><option>قطعة غيار من متجر شريك</option><option>أجرة عمل إضافية</option></select></div></div><div class="field"><label>السعر</label><div class="input">${icon('money','sm')}<input value="135 ج.م"></div></div><button class="btn btn-primary" data-action="send-change">إرسال للعميل للموافقة</button></div></div>`;return ''}
function render(){let h='';const map={welcome,auth,'customer-home':customerHome,'request':requestWizard,offers,checkout,'payment-success':paymentSuccess,'job-status':jobStatus,'change-order':changeOrder,dispute,store,partner,cart,'customer-orders':customerOrders,'customer-wallet':customerWallet,'technician-home':technicianHome,'technician-jobs':technicianJobs,'technician-active':technicianActive,'technician-wallet':technicianWallet,'merchant-home':merchantHome,'merchant-orders':merchantOrders,'merchant-catalog':merchantCatalog,'merchant-wallet':merchantWallet,'admin-home':adminHome,'admin-jobs':adminJobs,'admin-risk':adminRisk,'admin-finance':adminFinance,'admin-partners':adminPartners};h=map[state.screen]?map[state.screen]():profile(state.role);document.getElementById('app').innerHTML=h}
function go(s){state.screen=s;state.sheet=null;render()}
function roleHome(){state.tab='home';go(state.role+'-home')}
document.addEventListener('click',e=>{
 const jump=e.target.closest('[data-jump]');if(jump){state.role=jump.dataset.role;state.tab='home';go(jump.dataset.jump);return}
 const rs=e.target.closest('[data-role-select]');if(rs){state.role=rs.dataset.role;render();return}
 const cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;state.requestStep=2;go('request');return}
 const sc=e.target.closest('[data-select-category]');if(sc){state.category=sc.dataset.selectCategory;render();return}
 const tab=e.target.closest('[data-tab]');if(tab){let t=tab.dataset.tab;state.tab=t;if(state.role==='customer'){if(t==='new'){state.requestStep=1;go('request')}else go(t==='home'?'customer-home':t==='orders'?'customer-orders':t==='store'?'store':'customer-wallet')}if(state.role==='technician')go(t==='home'?'technician-home':t==='jobs'?'technician-jobs':t==='active'?'technician-active':t==='wallet'?'technician-wallet':'profile');if(state.role==='merchant')go(t==='home'?'merchant-home':t==='orders'?'merchant-orders':t==='catalog'?'merchant-catalog':t==='wallet'?'merchant-wallet':'profile');if(state.role==='admin')go(t==='home'?'admin-home':t==='jobs'?'admin-jobs':t==='risk'?'admin-risk':t==='finance'?'admin-finance':'admin-partners');return}
 const a=e.target.closest('[data-action]');if(!a)return;let x=a.dataset.action;
 switch(x){
  case 'login':go('auth');break;
  case 'enter':roleHome();break;
  case 'logout':go('welcome');break;
  case 'customer-home':state.role='customer';state.tab='home';go('customer-home');break;
  case 'new-request':state.requestStep=1;go('request');break;
  case 'next-step':if(state.requestStep<4){state.requestStep++;render()}else{go('offers')}break;
  case 'prev-step':state.requestStep--;render();break;
  case 'upload':state.photo=true;toast('تمت إضافة الصور');break;
  case 'checkout':go('checkout');break;
  case 'pay':state.paid=true;go('payment-success');break;
  case 'job-status':go('job-status');break;
  case 'change-order':go('change-order');break;
  case 'approve-change':toast('تم دفع الإضافة وإرسال الطلب للمحل');setTimeout(()=>go('job-status'),1000);break;
  case 'decline-change':toast('تم رفض الإضافة وإبلاغ الفني');break;
  case 'dispute':go('dispute');break;
  case 'open-case':toast('تم فتح تذكرة وتجميد التسوية');break;
  case 'add-cart':state.cart++;toast('تمت الإضافة للسلة');break;
  case 'cart':go('cart');break;
  case 'partner':go('partner');break;
  case 'store-pay':toast('تم الدفع وإصدار كود الاستلام');break;
  case 'toggle-online':state.online=!state.online;toast(state.online?'أنت متاح الآن':'تم إيقاف استقبال الطلبات');break;
  case 'bid':state.sheet='bid';render();break;
  case 'submit-bid':state.sheet=null;toast('تم إرسال العرض للعميل');break;
  case 'technician-change':state.sheet='tech-change';render();break;
  case 'send-change':state.sheet=null;toast('تم إرسال طلب التغيير للعميل');break;
  case 'prepare-order':toast('تم نقل الطلب إلى قيد التجهيز');break;
  case 'close-sheet':state.sheet=null;render();break;
  case 'chat':toast('المحادثة والاتصال الوسيط متاحان');break;
  case 'back':if(state.screen==='auth'){go('welcome')}else{roleHome()}break;
 }
});render();
</script>
