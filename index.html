    @media(max-width:850px){.page{display:block;padding:0;background:#fff}.demo-notes{display:none}.phone{width:100%;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}.phone:before{display:none}.statusbar{display:none}#app{height:100dvh}.welcome{padding-top:max(25px,env(safe-area-inset-top))}.topbar{padding-top:max(10px,env(safe-area-inset-top));min-height:calc(64px + env(safe-area-inset-top))}}
    @media(max-height:720px) and (min-width:851px){.phone{min-height:620px}.welcome-logo .brand-mark{width:64px;height:64px}.welcome-panel{margin-top:25px}.welcome-logo h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="page">
    <aside class="demo-notes">
      <div class="brand-lockup"><div class="brand-mark" id="desktop-logo"></div><div class="brand-name">عِدّة<small>كل خدمات الصيانة في مكان واحد</small></div></div>
      <h1>نموذج تفاعلي جاهز للعرض على العميل</h1>
      <p>جرّب رحلة العميل من إنشاء طلب الصيانة واستقبال عروض الفنيين إلى الدفع، أو انتقل إلى حساب الفني لتصفح الطلبات وتقديم عرض.</p>
      <div class="quick-title">انتقال سريع داخل النموذج</div>
      <div class="quick-grid">
        <button class="quick-btn" data-jump="customer-home">الرئيسية للعميل<span>الخدمات والطلبات</span></button>
        <button class="quick-btn" data-jump="create-request">إنشاء طلب<span>تفاصيل الصيانة</span></button>
        <button class="quick-btn" data-jump="offers">عروض الفنيين<span>المقارنة والقبول</span></button>
        <button class="quick-btn" data-jump="technician-home">واجهة الفني<span>الطلبات والأرباح</span></button>
      </div>
    </aside>
    <section class="phone" aria-label="نموذج تطبيق عِدّة">
      <div class="statusbar"><span>9:41</span><div class="status-icons"><div class="signal"><i></i><i></i><i></i><i></i></div><span>⌁</span><div class="battery"></div></div></div>
      <div id="app"></div>
    </section>
  </main>
  <script>
    const paths={
      wrench:'<path d="M14.7 6.3a4 4 0 0 0-5-5L7 3.8 4.2 1 1.7 3.5l2.8 2.8L2 8.8a4 4 0 0 0 5 5l7.4 7.4a2 2 0 0 0 2.8-2.8L9.8 11"/><path d="m16 13 5-5"/>',
      home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      shop:'<path d="M3 9h18l-1-5H4L3 9Z"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/>',
      orders:'<path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
      user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
      pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      arrow:'<path d="m15 18-6-6 6-6"/>',
      back:'<path d="m9 18 6-6-6-6"/>',
      chevron:'<path d="m9 18 6-6-6-6"/>',
      electricity:'<path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/>',
      plumbing:'<path d="M6 3v5a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v5"/><path d="M3 3h6M15 21h6"/>',
      ac:'<rect x="3" y="5" width="18" height="9" rx="2"/><path d="M7 18h10M9 14v4M15 14v4"/>',
      paint:'<path d="M14 4h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8"/><path d="M8 9v6M5 15h6v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-4Z"/>',
      carpenter:'<path d="M3 6h18M6 6V3h12v3M8 6v15M16 6v15M5 21h14"/>',
      appliance:'<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="14" r="5"/><path d="M7 6h.01M10 6h4"/>',
      lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
      dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
      cart:'<circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.5 11h10l2-7H7"/>',
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      camera:'<path d="M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4.5Z"/><circle cx="12" cy="12" r="4"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      star:'<path d="m12 2 3 6 6 .9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 8.9 9 8l3-6Z"/>',
      shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
      card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
      wallet:'<path d="M4 5h14a2 2 0 0 1 2 2v12H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M16 11h6v5h-6a2 2 0 0 1 0-5Z"/>',
      chat:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>',
      send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M7 9h.01M17 15h.01"/>',
      settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',
      logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
      phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.4 1.9.6 2.9.7a2 2 0 0 1 1.6 1.9Z"/>',
      list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
      dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'
    };
    const icon=(name,cls='')=>`<svg class="svg ${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.wrench}</svg>`;
    document.getElementById('desktop-logo').innerHTML=icon('wrench','lg');

    const state={screen:'welcome',role:'customer',tab:'home',requestStep:1,category:'كهرباء',photo:false,requestCreated:false,accepted:false,cart:0,online:true,toast:'',sheet:null,orderTab:'active'};
    const app=document.getElementById('app');
    const categories=[['electricity','كهرباء'],['plumbing','سباكة'],['ac','تكييف'],['paint','نقاشة'],['carpenter','نجارة'],['appliance','أجهزة منزلية'],['lock','أقفال'],['dots','خدمات أخرى']];
    const products=[['wrench','طقم مفاتيح 12 قطعة','620'],['electricity','مفك كهرباء معزول','185'],['paint','رول دهان احترافي','95'],['plumbing','طقم إصلاح حنفية','140']];
    function topbar(title,back=true,extra=''){return `<header class="topbar">${back?`<button class="circle-btn" data-action="back" aria-label="رجوع">${icon('back')}</button>`:'<span></span>'}<div class="title">${title}</div>${extra||'<span style="width:42px"></span>'}</header>`}
    function bottomNav(role=state.role){
      if(role==='technician') return `<nav class="bottomnav"><button class="navitem ${state.tab==='home'?'active':''}" data-tab="home">${icon('home')}<span>الرئيسية</span></button><button class="navitem ${state.tab==='jobs'?'active':''}" data-tab="jobs">${icon('list')}<span>طلباتي</span></button><button class="navitem ${state.tab==='earnings'?'active':''}" data-tab="earnings">${icon('money')}<span>الأرباح</span></button><button class="navitem ${state.tab==='profile'?'active':''}" data-tab="profile">${icon('user')}<span>حسابي</span></button></nav>`;
      return `<nav class="bottomnav"><button class="navitem ${state.tab==='home'?'active':''}" data-tab="home">${icon('home')}<span>الرئيسية</span></button><button class="navitem ${state.tab==='orders'?'active':''}" data-tab="orders">${icon('orders')}<span>طلباتي</span></button><button class="navitem create" data-action="new-request" aria-label="طلب جديد">${icon('plus')}</button><button class="navitem ${state.tab==='store'?'active':''}" data-tab="store">${icon('shop')}<span>المتجر</span></button><button class="navitem ${state.tab==='profile'?'active':''}" data-tab="profile">${icon('user')}<span>حسابي</span></button></nav>`;
    }
    function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';render()},1800)}
    function wrap(content,nav=true){return `<div class="screen">${content}</div>${nav?bottomNav():''}${state.sheet?renderSheet():''}${state.toast?`<div class="toast">${icon('check','sm')}${state.toast}</div>`:''}`}

    function welcome(){return `<div class="welcome"><div class="welcome-logo"><div class="brand-mark">${icon('wrench','lg')}</div><h1>عِدّة</h1><p>كل خدمات الصيانة في مكان واحد</p></div><div class="welcome-panel"><h2>أهلاً بيك</h2><p>اختار طريقة الاستخدام وابدأ التجربة</p><div class="role-grid"><button class="role-card selected" data-role-select="customer"><span class="iconbox">${icon('user')}</span>محتاج خدمة</button><button class="role-card" data-role-select="technician"><span class="iconbox">${icon('wrench')}</span>أنا فني</button></div><button class="btn btn-primary" data-action="login">متابعة ${icon('arrow','sm')}</button><div class="terms">باستمرارك أنت توافق على شروط الاستخدام وسياسة الخصوصية</div></div></div>`}
    function auth(){return `<div class="auth"><div class="auth-hero"><div class="mini-logo"><span class="brand-mark" style="width:43px;height:43px;border-radius:14px">${icon('wrench')}</span>عِدّة</div><h1>تسجيل الدخول</h1><p>اكتب رقم الموبايل وهنتأكد من هويتك بكود سريع</p></div><div class="form"><div class="field"><label>رقم الموبايل</label><div class="input-wrap">${icon('phone','sm')}<input id="phone-input" inputmode="numeric" value="01012345678" aria-label="رقم الموبايل"><span class="phone-prefix">+20</span></div></div></div><div class="auth-foot"><button class="btn btn-primary" data-action="send-otp">إرسال كود التحقق</button><button class="btn btn-ghost" data-action="guest">الدخول كزائر</button></div></div>`}
    function otp(){return `<div class="auth"><div class="auth-hero"><button class="circle-btn" data-action="back">${icon('back')}</button><h1 style="margin-top:35px">تأكيد رقم الموبايل</h1><p>بعتنالك كود مكوّن من 4 أرقام على<br><b dir="ltr">+20 010 1234 5678</b></p></div><div class="otp">${[1,2,3,4].map((n,i)=>`<input maxlength="1" inputmode="numeric" value="${i+1}" aria-label="رقم ${n}">`).join('')}</div><button class="btn btn-primary" data-action="verify">تأكيد ومتابعة</button><button class="btn btn-ghost" data-action="verify">إعادة إرسال الكود بعد 00:42</button></div>`}
    function customerHome(){return wrap(`<div class="home-head"><div class="home-user"><div class="userline"><div class="avatar">م</div><div><div style="font-size:11px;color:#bcd0df">أهلاً، محمد</div><b style="font-size:15px">تحتاج تصلّح إيه اليوم؟</b><div class="location">${icon('pin','sm')} مدينة نصر، القاهرة</div></div></div><button class="circle-btn">${icon('bell')}<span class="badge">2</span></button></div><button class="home-cta" data-action="new-request"><div><h2>اطلب فني دلوقتي</h2><p>اوصف المشكلة واستقبل أفضل العروض</p></div><div class="cta-icon">${icon('wrench','lg')}</div></button></div><div class="content"><section class="section"><div class="section-head"><h3>اختار الخدمة</h3><button class="link" data-action="new-request">عرض الكل</button></div><div class="categories">${categories.map(c=>`<button class="category" data-category="${c[1]}"><span class="iconbox">${icon(c[0])}</span>${c[1]}</button>`).join('')}</div></section><section class="section"><div class="section-head"><h3>${state.requestCreated?'طلبك الحالي':'طلب نشط'}</h3><button class="link" data-action="offers">التفاصيل</button></div><button class="card request-card" style="width:100%;text-align:right" data-action="offers"><div class="request-top"><span class="status ${state.accepted?'green':''}">${state.accepted?'تم اختيار الفني':'وصلت 3 عروض'}</span><span class="subtle">#REQ-2048</span></div><h4>${state.requestCreated?state.category:'إصلاح عطل كهربائي بالمطبخ'}</h4><div class="meta"><span>اليوم، 3:30 م</span><span>مدينة نصر</span></div><div class="progress"><i class="done"></i><b class="done"></b><i class="done"></i><b class="${state.accepted?'done':''}"></b><i class="${state.accepted?'done':''}"></i></div></button></section><section class="section"><div class="section-head"><h3>فنيين مميزين بالقرب منك</h3><button class="link" data-action="offers">عرض الكل</button></div><div class="tech-list">${[['أحمد سالم','كهربائي','4.9'],['محمود علي','فني تكييف','4.8'],['حسن سامي','سباك','4.7']].map((t,i)=>`<div class="tech-card"><div class="avatar">${t[0][0]}</div><h4>${t[0]}</h4><p>${t[1]}</p><div class="rating">★ ${t[2]} <span class="subtle">(${38+i*19})</span></div><div class="price">${180+i*40} ج.م <small>يبدأ من</small></div></div>`).join('')}</div></section><section class="section"><div class="section-head"><h3>من المتجر</h3><button class="link" data-tab="store">تسوّق الآن</button></div><div class="products">${products.slice(0,2).map(productCard).join('')}</div></section></div>`,true)}
    function productCard(p){return `<div class="product"><div class="product-img">${icon(p[0],'lg')}</div><div class="product-info"><h4>${p[1]}</h4><div class="product-row"><b>${p[2]} ج.م</b><button class="add-btn" data-action="add-cart" aria-label="إضافة للسلة">+</button></div></div></div>`}
    function createRequest(){const step=state.requestStep;let body='';if(step===1)body=`<div class="section-head"><h3>نوع الخدمة المطلوبة</h3><span class="subtle">اختار خدمة واحدة</span></div><div class="choice-list">${categories.map(c=>`<button class="choice ${state.category===c[1]?'selected':''}" data-select-category="${c[1]}"><span class="iconbox">${icon(c[0])}</span><span><strong>${c[1]}</strong><p>فني متخصص وتقييمات موثوقة</p></span><span class="radio"></span></button>`).join('')}</div>`;if(step===2)body=`<div class="section-head"><h3>اشرح المشكلة</h3><span class="subtle">كل ما توضح أكتر هيوصلك عرض أدق</span></div><div class="field"><label>وصف المشكلة</label><textarea>يوجد عطل يحتاج إلى فني متخصص، المشكلة بدأت اليوم وأحتاج المعاينة والإصلاح.</textarea></div><div class="field"><label>أضف صوراً أو فيديو</label><button class="upload ${state.photo?'done':''}" data-action="upload">${icon(state.photo?'check':'camera')} ${state.photo?'تمت إضافة صورتين':'اضغط لإضافة صور المشكلة'}</button></div><div class="field"><label>العنوان</label><button class="choice selected">${icon('pin')}<span><strong>المنزل</strong><p>شارع أحمد فخري، مدينة نصر</p></span><span class="radio"></span></button></div>`;if(step===3)body=`<div class="section-head"><h3>الوقت والميزانية</h3><span class="subtle">حدد الأنسب ليك</span></div><div class="field"><label>موعد الزيارة</label><div class="choice-list"><button class="choice selected">${icon('clock')}<span><strong>في أقرب وقت</strong><p>خلال ساعتين إلى 4 ساعات</p></span><span class="radio"></span></button><button class="choice">${icon('calendar')}<span><strong>تحديد موعد</strong><p>اختر اليوم والساعة المناسبة</p></span><span class="radio"></span></button></div></div><div class="field"><label>الميزانية المتوقعة</label><div class="input-wrap">${icon('money','sm')}<input value="300 - 500 ج.م" aria-label="الميزانية"></div></div><div class="card" style="background:#fff8f2;border-color:#ffe1ca"><div style="display:flex;gap:10px">${icon('shield')}<div><b style="font-size:13px">دفع آمن داخل التطبيق</b><p class="subtle" style="margin:4px 0 0;line-height:1.7">مش هيتحول المبلغ للفني إلا بعد تأكيد إتمام الخدمة</p></div></div></div>`;return `<div class="has-actions">${topbar('طلب خدمة جديدة')}<div class="stepper"><span class="${step>=1?'active':''}">1</span><i class="${step>1?'done':''}"></i><span class="${step>=2?'active':''}">2</span><i class="${step>2?'done':''}"></i><span class="${step>=3?'active':''}">3</span></div><div class="content">${body}</div></div><div class="sticky-actions">${step>1?'<button class="btn btn-soft" data-action="prev-step">السابق</button>':''}<button class="btn btn-primary" data-action="next-step">${step===3?'نشر الطلب':'متابعة'}</button></div>`}
    function offers(){return `<div class="has-actions">${topbar('عروض الفنيين',true,`<button class="circle-btn" data-action="chat">${icon('chat')}</button>`)}<div class="content"><div class="card request-card section"><div class="request-top"><span class="status">3 عروض جديدة</span><span class="subtle">#REQ-2048</span></div><h4>${state.category}</h4><div class="meta"><span>في أقرب وقت</span><span>مدينة نصر</span></div></div><div class="tabs"><button class="tab active">الأنسب</button><button class="tab">الأقل سعراً</button><button class="tab">الأعلى تقييماً</button></div>${[['أحمد سالم','4.9','146','320','45 دقيقة','فني كهرباء معتمد، أقدر أوصل خلال 45 دقيقة والسعر شامل المعاينة.'],['محمود حمدي','4.8','98','280','ساعة','متخصص في الأعطال المنزلية والسعر يشمل الزيارة والإصلاح البسيط.'],['سعيد علي','4.7','72','350','30 دقيقة','متاح الآن ومعي قطع الغيار الأساسية المطلوبة.']].map((o,i)=>`<div class="card offer"><div class="offer-main"><div class="avatar">${o[0][0]}</div><div class="offer-body"><div class="offer-name"><div><h4>${o[0]} <span class="verified">✓ موثّق</span></h4><span class="rating">★ ${o[1]} <span class="subtle">(${o[2]} تقييم)</span></span></div><button class="circle-btn" style="width:34px;height:34px">${icon('dots','sm')}</button></div><p class="offer-note">${o[5]}</p></div></div><div class="offer-footer"><div class="offer-price">${o[3]} ج.م<small>الوصول خلال ${o[4]}</small></div><button class="btn btn-dark btn-sm" data-accept="${o[0]}|${o[3]}">قبول العرض</button></div></div>`).join('')}</div></div>`}
    function payment(){return `<div class="has-actions">${topbar('الدفع الآمن')}<div class="content"><div class="section"><div class="section-head"><h3>ملخص الخدمة</h3></div><div class="summary"><div class="summary-row"><span>عرض الفني</span><b>320 ج.م</b></div><div class="summary-row"><span>رسوم تشغيل المنصة</span><b>25 ج.م</b></div><div class="summary-row"><span>خصم النقاط</span><b style="color:#74e2b6">-15 ج.م</b></div><div class="summary-row total"><span>الإجمالي</span><span>330 ج.م</span></div></div></div><section class="section"><div class="section-head"><h3>طريقة الدفع</h3><button class="link">إضافة بطاقة</button></div><div class="choice-list"><button class="choice selected"><span class="pay-logo">VISA</span><span><strong>•••• 4242</strong><p>تنتهي في 09/29</p></span><span class="radio"></span></button><button class="choice"><span class="pay-logo">WALLET</span><span><strong>محفظة إلكترونية</strong><p>010 1234 5678</p></span><span class="radio"></span></button><button class="choice"><span class="pay-logo">CASH</span><span><strong>الدفع عند إتمام الخدمة</strong><p>ادفع للفني بعد الانتهاء</p></span><span class="radio"></span></button></div></section><div class="card" style="display:flex;gap:10px;align-items:center">${icon('shield')}<div><b style="font-size:12px">معلوماتك محمية بالكامل</b><div class="subtle">لن يُصرف المبلغ قبل إتمام الخدمة</div></div></div></div></div><div class="sticky-actions"><button class="btn btn-primary" data-action="pay">ادفع 330 ج.م ${icon('lock','sm')}</button></div>`}
    function success(){return `<div class="success"><div class="success-ring">${icon('check','lg')}</div><h1>تم تأكيد الحجز</h1><p>تم حجز الفني أحمد سالم بنجاح<br>وسيتواصل معك قبل الوصول</p><div class="card" style="width:100%;text-align:right;margin-bottom:16px"><div class="order-item" style="margin:0"><div class="avatar">أ</div><div><h4>أحمد سالم</h4><p>فني كهرباء • الوصول خلال 45 دقيقة</p><span class="rating">★ 4.9</span></div></div></div><button class="btn btn-primary" data-action="chat">محادثة الفني</button><button class="btn btn-soft" data-action="customer-home">متابعة الطلب</button></div>`}
    function orders(){return wrap(`${topbar('طلباتي',false)}<div class="content"><div class="tabs"><button class="tab ${state.orderTab==='active'?'active':''}" data-order-tab="active">الحالية</button><button class="tab ${state.orderTab==='past'?'active':''}" data-order-tab="past">المكتملة</button></div>${state.orderTab==='active'?`<button class="card request-card" style="width:100%;text-align:right" data-action="offers"><div class="request-top"><span class="status ${state.accepted?'green':''}">${state.accepted?'الفني في الطريق':'في انتظار الاختيار'}</span><span class="subtle">#REQ-2048</span></div><h4>${state.category}</h4><div class="meta"><span>أحمد سالم</span><span>330 ج.م</span></div></button>`:`${[['صيانة تكييف','تمت في 12 أغسطس','480'],['إصلاح تسريب مياه','تمت في 3 أغسطس','260']].map(x=>`<div class="card order-item"><span class="iconbox">${icon('wrench')}</span><div><h4>${x[0]}</h4><p>${x[1]}</p><span class="rating">★★★★★</span></div><span class="amount">${x[2]} ج.م</span></div>`).join('')}`}</div>`,true)}
    function store(){return wrap(`${topbar('متجر عِدّة',false,`<button class="circle-btn" data-action="cart">${icon('cart')}<span class="badge">${state.cart}</span></button>`)}<div class="search">${icon('search','sm')}<input placeholder="ابحث عن أداة أو خامة"></div><div class="content"><div class="tech-list section">${['الكل','كهرباء','سباكة','دهانات','أدوات'].map((x,i)=>`<button class="btn ${i===0?'btn-dark':'btn-soft'} btn-sm">${x}</button>`).join('')}</div><div class="products">${products.map(productCard).join('')}</div></div>`,true)}
    function cart(){return `<div class="has-actions">${topbar('سلة المشتريات')}<div class="content">${products.slice(0,Math.max(1,state.cart)).map((p,i)=>`<div class="card order-item"><span class="iconbox">${icon(p[0])}</span><div><h4>${p[1]}</h4><p>الكمية: 1</p></div><span class="amount">${p[2]} ج.م</span></div>`).join('')}<div class="summary" style="margin-top:18px"><div class="summary-row"><span>المنتجات</span><b>620 ج.م</b></div><div class="summary-row"><span>التوصيل</span><b>35 ج.م</b></div><div class="summary-row total"><span>الإجمالي</span><span>655 ج.م</span></div></div></div></div><div class="sticky-actions"><button class="btn btn-primary" data-action="store-pay">إتمام الشراء</button></div>`}
    function profile(){return wrap(`<div class="profile-hero"><div class="avatar">م</div><h2>محمد أدهم</h2><p>010 1234 5678 • عضو منذ 2026</p></div><div class="content"><div class="wallet section"><div class="card"><strong>1,250</strong><span>نقاط عِدّة</span></div><div class="card"><strong>180 ج.م</strong><span>رصيد المحفظة</span></div></div><div class="menu-list"><button class="menu-item">${icon('pin')}<b>العناوين المحفوظة</b><span class="arrow">‹</span></button><button class="menu-item">${icon('card')}<b>طرق الدفع</b><span class="arrow">‹</span></button><button class="menu-item">${icon('star')}<b>تقييماتي</b><span class="arrow">‹</span></button><button class="menu-item">${icon('settings')}<b>الإعدادات</b><span class="arrow">‹</span></button><button class="menu-item" data-action="logout" style="color:var(--red)">${icon('logout')}<b>تسجيل الخروج</b></button></div></div>`,true)}
    function chat(){return `<div class="chat">${topbar('أحمد سالم',true,`<button class="circle-btn">${icon('phone')}</button>`)}<div class="chat-body"><div class="bubble them">مساء الخير يا فندم، أنا أحمد الفني اللي حضرتك اخترته.<time>4:18 م</time></div><div class="bubble me">أهلاً يا أستاذ أحمد، إمتى تقريباً هتوصل؟<time>4:19 م</time></div><div class="bubble them">أنا في الطريق وحكون عند حضرتك خلال 35 دقيقة إن شاء الله.<time>4:20 م</time></div><div class="bubble me">تمام، في انتظارك.<time>4:21 م</time></div></div><div class="chat-input"><input id="msg" placeholder="اكتب رسالتك..."><button data-action="send">${icon('send','sm')}</button></div></div>`}
    function technicianHome(){return wrap(`<div class="tech-head"><div class="home-user"><div class="userline"><div class="avatar">أ</div><div><div style="font-size:11px;color:#bad1df">أهلاً، أحمد</div><b>ابدأ شغلك اليوم</b></div></div><button class="circle-btn">${icon('bell')}<span class="badge">4</span></button></div><div class="online-row"><div><b style="font-size:13px">متاح لاستقبال الطلبات</b><div style="font-size:10px;color:#bdd5cf">هيظهر حسابك للعملاء القريبين</div></div><button class="switch ${state.online?'':'off'}" data-action="toggle-online" aria-label="حالة التوفر"></button></div></div><div class="content"><div class="stats section"><div class="stat"><strong>4.9</strong><span>التقييم</span></div><div class="stat"><strong>146</strong><span>خدمة مكتملة</span></div><div class="stat"><strong>1,840</strong><span>أرباح الأسبوع</span></div></div><section class="section"><div class="section-head"><h3>طلبات قريبة منك</h3><button class="link" data-tab="jobs">عرض الكل</button></div>${jobCards(3)}</section></div>`,true)}
    function jobCards(count=4){const jobs=[['كهرباء','عطل في مفتاح الكهرباء بالمطبخ','مدينة نصر • 1.2 كم','300 - 500 ج.م'],['تكييف','التكييف لا يبرد ويصدر صوتاً','مصر الجديدة • 2.4 كم','450 - 700 ج.م'],['أجهزة منزلية','غسالة لا تكمل دورة التشغيل','مدينة نصر • 3.1 كم','350 - 600 ج.م'],['سباكة','تسريب مياه أسفل الحوض','الحي السابع • 3.8 كم','250 - 400 ج.م']];return jobs.slice(0,count).map((j,i)=>`<div class="card job"><div class="job-top"><span class="status">${j[0]}</span><span class="subtle">منذ ${i+2*5} دقائق</span></div><h4 style="margin-top:10px">${j[1]}</h4><p class="job-desc">العميل أضاف وصفاً وصورتين للمشكلة ويرغب في الزيارة في أقرب وقت.</p><div class="meta">${icon('pin','sm')} ${j[2]}</div><div class="job-footer"><span class="job-budget">${j[3]}</span><button class="btn btn-dark btn-sm" data-action="bid">تقديم عرض</button></div></div>`).join('')}
    function technicianJobs(){return wrap(`${topbar('طلباتي',false)}<div class="content"><div class="tabs"><button class="tab active">العروض المقدمة</button><button class="tab">الخدمات الحالية</button><button class="tab">المكتملة</button></div>${jobCards(4)}</div>`,true)}
    function earnings(){return wrap(`${topbar('الأرباح',false)}<div class="content"><div class="summary section" style="padding:20px"><span style="font-size:11px;color:#b8cad7">الرصيد المتاح للسحب</span><div style="font-size:29px;font-weight:800;margin:6px 0 15px">4,860 ج.م</div><button class="btn btn-primary btn-sm">سحب الأرباح</button></div><div class="stats section" style="margin-top:0"><div class="stat"><strong>1,840</strong><span>هذا الأسبوع</span></div><div class="stat"><strong>7</strong><span>خدمات</span></div><div class="stat"><strong>263</strong><span>متوسط الخدمة</span></div></div><div class="section-head"><h3>آخر المعاملات</h3><button class="link">عرض الكل</button></div>${[['إصلاح عطل كهربائي','اليوم، 3:20 م','+320'],['صيانة لوحة كهرباء','أمس، 6:10 م','+480'],['رسوم المنصة','أمس، 6:11 م','-38']].map((x,i)=>`<div class="card order-item"><span class="iconbox">${icon(i===2?'wallet':'wrench')}</span><div><h4>${x[0]}</h4><p>${x[1]}</p></div><span class="amount" style="color:${i===2?'var(--red)':'var(--green)'}">${x[2]} ج.م</span></div>`).join('')}</div>`,true)}
    function technicianProfile(){return wrap(`<div class="profile-hero" style="background:linear-gradient(145deg,#0e2d48,#17634f)"><div class="avatar">أ</div><h2>أحمد سالم</h2><p>فني كهرباء موثّق • ★ 4.9</p></div><div class="content"><div class="wallet section"><div class="card"><strong>146</strong><span>خدمة مكتملة</span></div><div class="card"><strong>98%</strong><span>معدل القبول</span></div></div><div class="menu-list"><button class="menu-item">${icon('user')}<b>بيانات الملف المهني</b><span class="arrow">‹</span></button><button class="menu-item">${icon('shield')}<b>الوثائق والتحقق</b><span class="status green">موثّق</span></button><button class="menu-item">${icon('money')}<b>بيانات التحويل</b><span class="arrow">‹</span></button><button class="menu-item">${icon('settings')}<b>الإعدادات</b><span class="arrow">‹</span></button><button class="menu-item" data-action="logout" style="color:var(--red)">${icon('logout')}<b>تسجيل الخروج</b></button></div></div>`,true)}
    function renderSheet(){if(state.sheet==='bid')return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet" onclick="event.stopPropagation()"><h3>تقديم عرض للعميل</h3><p>اكتب السعر المتوقع وموعد الوصول</p><div class="field"><label>السعر المقترح</label><div class="input-wrap">${icon('money','sm')}<input value="320 ج.م"></div></div><div class="field"><label>وقت الوصول</label><div class="input-wrap">${icon('clock','sm')}<input value="خلال 45 دقيقة"></div></div><div class="field"><label>رسالة للعميل</label><textarea style="min-height:75px">متاح الآن والسعر يشمل المعاينة والإصلاح البسيط.</textarea></div><button class="btn btn-primary" data-action="submit-bid">إرسال العرض</button></div></div>`;return ''}
    function render(){let html='';switch(state.screen){case'welcome':html=welcome();break;case'auth':html=auth();break;case'otp':html=otp();break;case'customer-home':html=customerHome();break;case'create-request':html=createRequest();break;case'offers':html=offers();break;case'payment':html=payment();break;case'success':html=success();break;case'orders':html=orders();break;case'store':html=store();break;case'cart':html=cart();break;case'profile':html=profile();break;case'chat':html=chat();break;case'technician-home':html=technicianHome();break;case'technician-jobs':html=technicianJobs();break;case'earnings':html=earnings();break;case'technician-profile':html=technicianProfile();break;default:html=welcome()}app.innerHTML=html}
    function go(screen){state.screen=screen;state.sheet=null;render()}
    document.addEventListener('click',e=>{
      const jump=e.target.closest('[data-jump]');if(jump){const v=jump.dataset.jump;if(v==='technician-home'){state.role='technician';state.tab='home'}else{state.role='customer';state.tab='home'};go(v);return}
      const rs=e.target.closest('[data-role-select]');if(rs){state.role=rs.dataset.role;document.querySelectorAll('.role-card').forEach(x=>x.classList.remove('selected'));rs.classList.add('selected');return}
      const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;if(state.role==='technician')go(state.tab==='home'?'technician-home':state.tab==='jobs'?'technician-jobs':state.tab==='earnings'?'earnings':'technician-profile');else go(state.tab==='home'?'customer-home':state.tab==='orders'?'orders':state.tab==='store'?'store':'profile');return}
      const cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;state.requestStep=2;go('create-request');return}
      const select=e.target.closest('[data-select-category]');if(select){state.category=select.dataset.selectCategory;render();return}
      const accept=e.target.closest('[data-accept]');if(accept){state.accepted=true;go('payment');return}
      const ot=e.target.closest('[data-order-tab]');if(ot){state.orderTab=ot.dataset.orderTab;render();return}
      const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;
      if(action==='login')go('auth');
      else if(action==='send-otp')go('otp');
      else if(action==='verify'||action==='guest'){state.tab='home';go(state.role==='technician'?'technician-home':'customer-home')}
      else if(action==='new-request'){state.requestStep=1;go('create-request')}
      else if(action==='next-step'){if(state.requestStep<3){state.requestStep++;render()}else{state.requestCreated=true;go('offers')}}
      else if(action==='prev-step'){state.requestStep--;render()}
      else if(action==='upload'){state.photo=true;toast('تمت إضافة الصور بنجاح')}
      else if(action==='offers')go('offers');
      else if(action==='pay'){state.accepted=true;go('success')}
      else if(action==='customer-home'){state.tab='home';go('customer-home')}
      else if(action==='chat')go('chat');
      else if(action==='send'){const input=document.getElementById('msg');if(input&&input.value.trim())toast('تم إرسال الرسالة')}
      else if(action==='add-cart'){state.cart++;toast('تمت الإضافة إلى السلة')}
      else if(action==='cart')go('cart');
      else if(action==='store-pay')toast('تم تأكيد طلب المتجر')
      else if(action==='toggle-online'){state.online=!state.online;toast(state.online?'أنت متاح الآن':'تم إيقاف استقبال الطلبات')}
      else if(action==='bid'){state.sheet='bid';render()}
      else if(action==='close-sheet'){state.sheet=null;render()}
      else if(action==='submit-bid'){state.sheet=null;toast('تم إرسال عرضك للعميل')}
      else if(action==='logout'){state.screen='welcome';state.tab='home';render()}
      else if(action==='back'){if(state.screen==='auth')go('welcome');else if(state.screen==='otp')go('auth');else if(['payment'].includes(state.screen))go('offers');else if(state.screen==='chat')go(state.role==='technician'?'technician-home':'orders');else if(['offers','create-request','cart'].includes(state.screen))go('customer-home');else go(state.role==='technician'?'technician-home':'customer-home')}
    });
    render();
  </script>
</body>
</html>
